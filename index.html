            desc: "搭乘 13:25 班機返台，於 14:00 順利抵達桃園機場，結束愉快沖繩之旅！",
            tag: "交通",
            location: "桃園國際機場"
          }
        ]
      }
    ];

    let currentDayIdx = 0;
    let checkedItems = JSON.parse(localStorage.getItem('okinawa_trip_checked') || '{}');

    // 渲染函式
    function render() {
      const container = document.getElementById('itineraryContainer');
      const dayData = tripData[currentDayIdx];
      const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();

      // 如果有搜尋字串，跨所有天數篩選
      if (searchTerm) {
        let resultsHTML = `<div class="text-xs font-bold text-slate-500 mb-3">搜尋「${searchTerm}」的結果：</div>`;
        let foundAny = false;

        tripData.forEach((dayObj) => {
          dayObj.items.forEach(item => {
            if (item.title.toLowerCase().includes(searchTerm) ||
                item.desc.toLowerCase().includes(searchTerm) ||
                item.time.toLowerCase().includes(searchTerm) ||
                item.tag.toLowerCase().includes(searchTerm)) {
              foundAny = true;
              resultsHTML += renderCard(item, dayObj.day, dayObj.date);
            }
          });
        });

        if (!foundAny) {
          resultsHTML += `<div class="p-8 text-center text-slate-400 bg-white rounded-2xl">沒有找到相關行程項目</div>`;
        }
        container.innerHTML = resultsHTML;
        return;
      }

      // 正常按 Day 渲染
      let html = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-slate-100 gap-2 mb-4">
          <div>
            <div class="text-xs font-black text-sky-600 uppercase tracking-widest">Day ${dayData.day} ・ ${dayData.date}</div>
            <h2 class="text-lg md:text-xl font-black text-slate-800">${dayData.title}</h2>
          </div>
          <span class="inline-flex items-center gap-1 text-xs bg-sky-50 text-sky-700 px-3 py-1 rounded-full font-medium self-start sm:self-auto">
            <i class="ph-bold ph-bed"></i> ${dayData.badge}
          </span>
        </div>
      `;

      dayData.items.forEach(item => {
        html += renderCard(item, dayData.day);
      });

      container.innerHTML = html;
      updateProgress();
    }

    function renderCard(item, dayNum, dayDate) {
      const isChecked = !!checkedItems[item.id];
      const mapLink = item.location
        ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.location)}`
        : null;

      return `
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 hover:border-sky-200 transition mb-3 ${isChecked ? 'opacity-60 bg-slate-50' : ''}">
          <div class="flex items-start justify-between gap-3">
            <!-- 勾選框 -->
            <button onclick="toggleCheck('${item.id}')" class="mt-0.5 text-xl transition transform active:scale-95 ${isChecked ? 'text-emerald-500' : 'text-slate-300 hover:text-slate-400'}">
              <i class="ph-fill ${isChecked ? 'ph-check-circle' : 'ph-circle'}"></i>
            </button>

            <!-- 內容本體 -->
            <div class="flex-1 min-w-0">
              <div class="flex flex-wrap items-center gap-2 mb-1">
                <span class="text-xs font-bold text-sky-700 bg-sky-50 px-2.5 py-0.5 rounded-md flex items-center gap-1">
                  <i class="ph ph-clock"></i> ${item.time}
                </span>
                <span class="text-xs font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md">
                  ${item.tag}
                </span>
                ${dayDate ? `<span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">Day ${dayNum} (${dayDate})</span>` : ''}
              </div>

              <h3 class="text-base font-bold text-slate-800 ${isChecked ? 'line-through text-slate-400' : ''}">
                ${item.title}
              </h3>
              <p class="text-xs md:text-sm text-slate-600 mt-1 leading-relaxed whitespace-pre-line">
                ${item.desc}
              </p>
            </div>

            <!-- 地圖導航連結 -->
            ${mapLink ? `
              <a href="${mapLink}" target="_blank" rel="noopener noreferrer" title="開啟 Google Maps" class="shrink-0 p-2 text-slate-400 hover:text-sky-600 hover:bg-sky-50 rounded-xl transition">
                <i class="ph-bold ph-navigation-arrow text-xl"></i>
              </a>
            ` : ''}
          </div>
        </div>
      `;
    }

    function switchTab(idx) {
      currentDayIdx = idx;
      document.getElementById('searchInput').value = '';
      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach((tab, index) => {
        if (index === idx) {
          tab.className = "tab-btn active shrink-0 px-4 py-2 rounded-xl text-xs md:text-sm font-bold bg-white text-sky-700 shadow-sm transition";
        } else {
          tab.className = "tab-btn shrink-0 px-4 py-2 rounded-xl text-xs md:text-sm font-bold bg-white/20 hover:bg-white/30 text-white transition";
        }
      });
      render();
    }

    function toggleCheck(id) {
      if (checkedItems[id]) {
        delete checkedItems[id];
      } else {
        checkedItems[id] = true;
      }
      localStorage.setItem('okinawa_trip_checked', JSON.stringify(checkedItems));
      render();
    }

    function updateProgress() {
      let total = 0;
      let completed = 0;
      tripData.forEach(day => {
        day.items.forEach(item => {
          total++;
          if (checkedItems[item.id]) completed++;
        });
      });

      const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
      document.getElementById('progressBar').style.width = `${percentage}%`;
      document.getElementById('progressText').innerText = `${completed} / ${total} 完成 (${percentage}%)`;
    }

    // 搜尋監聽
    document.getElementById('searchInput').addEventListener('input', () => {
      render();
    });

    // 初始渲染
    render();
  </script>
</body>
</html>
