* 住宿：溫暖的家

* 地點：瀨長島 Umikaji Terrace
* 說明：辦理退房，沿 58 號公路南下開往那霸方向（車程約 40 分鐘）。

* 說明：純白希臘風階梯聚落吹海風、喝果汁，近距離看大客機從眼前低空呼嘯降落。

* 說明：抵達國際線航廈辦理登機與托運行李。中餐於航廈美食街用餐；商店街採買紅芋塔、雪鹽夾心餅等最後伴手禮。

### 13:25 - 14:00【飛行時間】
* 分類：交通
* 地點：桃園國際機場
* 說明：搭乘 13:25 班機（OKA ➔ TPE），下午 14:00 順利返抵台灣桃園機場。`;

    let tripData = [];
    let currentDayIdx = 0;
    let checkedItems = JSON.parse(localStorage.getItem('okinawa_trip_checked') || '{}');

    // 正則匹配候選/順位項（例如：順位 1（首選推薦）：Taco Rice Cafe Kijimuna 或 選項 1（迴轉壽司）：Gourmet...）
    const candidateRegex = /^(?:順位\s*\d+|選項\s*\d+|推薦\s*\d+|備案\s*\d*)(?:[（(].*?[）)])?[:：]\s*(.*)$/;

    function parseMarkdown(mdText) {
      const lines = mdText.split('\n');
      let title = "沖繩 5D4N 親子自駕慢活之旅";
      let subtitle = "2026/09/26（六）- 09/30（三）";
      const days = [];
      let currentDay = null;
      let currentItem = null;
      let itemIdCounter = 1;

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line) continue;

        if (line.startsWith('# ')) {
          title = line.replace('# ', '').trim();
        } else if (line.startsWith('> 日期：')) {
          subtitle = line.replace('> 日期：', '').trim();
        } else if (line.startsWith('## Day')) {
          const dayMatch = line.match(/^##\s*Day\s*(\d+)[:：]\s*(.*?)\s+(.*)$/);
          if (dayMatch) {
            currentDay = {
              day: parseInt(dayMatch[1], 10),
              date: dayMatch[2].trim(),
              title: dayMatch[3].trim(),
              badge: "住宿：未定",
              items: []
            };
          } else {
            currentDay = {
              day: days.length + 1,
              date: "",
              title: line.replace('## ', '').trim(),
              badge: "住宿：未定",
              items: []
            };
          }
          days.push(currentDay);
          currentItem = null;
        } else if (line.startsWith('* 住宿：') && currentDay) {
          currentDay.badge = line.replace('* ', '').trim();
        } else if (line.startsWith('### ') && currentDay) {
          const itemMatch = line.match(/^###\s*(.*?)【(.*?)】/);
          currentItem = {
            id: `item-${itemIdCounter++}`,
            time: itemMatch ? itemMatch[1].trim() : "",
            title: itemMatch ? itemMatch[2].trim() : line.replace('### ', '').trim(),
            tag: "行程",
            location: "",
            desc: "",
            options: [] // 儲存多選項候選陣列
          };
          currentDay.items.push(currentItem);
        } else if (currentItem) {
          if (line.startsWith('* 分類：')) {
            currentItem.tag = line.replace('* 分類：', '').trim();
          } else if (line.startsWith('* 地點：')) {
            currentItem.location = line.replace('* 地點：', '').trim();
          } else if (line.startsWith('* 說明：')) {
            const descContent = line.replace('* 說明：', '').trim();
            if (descContent) processItemLine(currentItem, descContent);
          } else if (line.startsWith('* ')) {
            processItemLine(currentItem, line.replace('* ', '').trim());
          } else {
            processItemLine(currentItem, line);
          }
        }
      }

      return { title, subtitle, days };
    }

    // 判斷是否為優先順序 / 多選項結構，若是則單獨抽為獨立卡片資料
    function processItemLine(item, text) {
      const match = text.match(candidateRegex);
      if (match) {
        // 抓出標籤（如 "順位 1（首選推薦）"）
        const colonIdx = text.indexOf('：') !== -1 ? text.indexOf('：') : text.indexOf(':');
        const badgePart = text.substring(0, colonIdx).trim();
        const contentPart = text.substring(colonIdx + 1).trim();

        // 嘗試從 contentPart 抽取名稱與說明：如 Taco Rice Cafe Kijimuna（1F，必吃招牌...）
        let optName = contentPart;
        let optDetail = "";
        const parenIdx = contentPart.indexOf('（') !== -1 ? contentPart.indexOf('（') : contentPart.indexOf('(');

        if (parenIdx !== -1) {
          optName = contentPart.substring(0, parenIdx).trim();
          optDetail = contentPart.substring(parenIdx + 1).replace(/[）)]$/, '').trim();
        }

        item.options.push({
          badge: badgePart,
          name: optName,
          detail: optDetail || contentPart,
          location: optName
        });
      } else {
        // 一般常規說明
        item.desc += (item.desc ? '\n' : '') + text;
      }
    }

    async function loadItinerary() {
      let mdContent = fallbackMarkdown;
      try {
        const response = await fetch('itinerary.md?t=' + new Date().getTime());
        if (response.ok) {
          mdContent = await response.text();
        }
      } catch (e) {
        console.warn("無法 fetch itinerary.md（可能是本機 file:// 環境），自動切換至內建 fallback 數據。");
      }

      applyParsedMarkdown(mdContent);
    }

    function applyParsedMarkdown(mdText) {
      const parsed = parseMarkdown(mdText);
      tripData = parsed.days;

      document.getElementById('siteTitle').innerText = parsed.title;
      document.getElementById('siteSubtitle').innerText = parsed.subtitle;
      document.getElementById('manualMdInput').value = mdText;

      buildTabs();
      render();
    }

    // 建立頂部頁籤
    function buildTabs() {
      const tabNav = document.getElementById('tabNav');
      tabNav.innerHTML = '';

      tripData.forEach((d, idx) => {
        const btn = document.createElement('button');
        const isCurrent = idx === currentDayIdx;
        btn.className = `tab-btn shrink-0 px-3.5 py-1.5 rounded-xl text-xs md:text-sm font-bold transition flex items-center gap-1.5 ${
          isCurrent 
            ? "bg-white text-sky-700 shadow-sm" 
            : "bg-white/15 hover:bg-white/25 text-white"
        }`;
        
        btn.innerHTML = `<span>Day ${d.day}</span><span class="text-[11px] font-normal opacity-90">${d.date.split('（')[0]}</span>`;
        btn.onclick = () => switchTab(idx);
        tabNav.appendChild(btn);
      });
    }

    function render() {
      const container = document.getElementById('itineraryContainer');
      const searchInput = document.getElementById('searchInput');
      const searchTerm = searchInput.value.trim().toLowerCase();
      const clearBtn = document.getElementById('clearSearchBtn');
      const daySummaryCard = document.getElementById('daySummaryCard');

      if (searchTerm) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }

      if (!tripData || tripData.length === 0) return;

      // 搜尋模式（跨所有天數）
      if (searchTerm) {
        daySummaryCard.classList.add('hidden');
        let resultsHTML = `
          <div class="flex items-center justify-between text-xs font-bold text-slate-500 mb-2 px-1">
            <span>找到符合「${searchTerm}」的搜尋結果：</span>
            <button onclick="clearSearch()" class="text-sky-600 hover:underline">清除搜尋</button>
          </div>
        `;
        let count = 0;

        tripData.forEach((dayObj) => {
          dayObj.items.forEach(item => {
            const inOptions = item.options.some(o => 
              o.name.toLowerCase().includes(searchTerm) || 
              o.detail.toLowerCase().includes(searchTerm) ||
              o.badge.toLowerCase().includes(searchTerm)
            );

            if (item.title.toLowerCase().includes(searchTerm) ||
                item.desc.toLowerCase().includes(searchTerm) ||
                item.time.toLowerCase().includes(searchTerm) ||
                item.tag.toLowerCase().includes(searchTerm) ||
                inOptions) {
              count++;
              resultsHTML += renderCard(item, dayObj.day, dayObj.date);
            }
          });
        });

        if (count === 0) {
          resultsHTML += `
            <div class="p-10 text-center text-slate-400 bg-white rounded-2xl border border-slate-100">
              <i class="ph ph-magnifying-glass text-3xl mb-2 text-slate-300"></i>
              <p class="text-sm">沒有找到符合「${searchTerm}」的行程項目</p>
            </div>
          `;
        }
        container.innerHTML = resultsHTML;
        return;
      }

      // 常規天數模式
      const dayData = tripData[currentDayIdx];
      daySummaryCard.classList.remove('hidden');
      document.getElementById('dayBadge').innerText = `DAY ${dayData.day} ・ ${dayData.date}`;
      document.getElementById('dayHeading').innerText = dayData.title;
      
      const hotelContainer = document.getElementById('hotelBadgeContainer');
      if (dayData.badge) {
        hotelContainer.innerHTML = `
          <span class="inline-flex items-center gap-1.5 text-xs bg-sky-50 border border-sky-100 text-sky-700 px-3 py-1 rounded-xl font-medium self-start sm:self-auto">
            <i class="ph-fill ph-bed text-sky-500"></i>
            <span>${dayData.badge}</span>
          </span>
        `;
      } else {
        hotelContainer.innerHTML = '';
      }

      let html = '';
      dayData.items.forEach(item => {
        html += renderCard(item, dayData.day);
      });

      container.innerHTML = html;
      updateProgress();
    }

    // 產生單一項目卡片，內含多選項 (Options) 渲染
    function renderCard(item, dayNum, dayDate) {
      const isChecked = !!checkedItems[item.id];
      const mainMapLink = item.location
        ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.location)}`
        : null;

      // 產生選項卡片 HTML
      let optionsHTML = '';
      if (item.options && item.options.length > 0) {
        optionsHTML = `
          <div class="mt-3.5 pt-3 border-t border-slate-100/90 space-y-2">
            <div class="text-[11px] font-bold text-slate-500 flex items-center gap-1">
              <i class="ph-bold ph-git-fork text-amber-500"></i>
              <span>精選推薦 / 候選順位：</span>
            </div>
            <div class="grid grid-cols-1 gap-2">
        `;

        item.options.forEach((opt, idx) => {
          const optMapLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(opt.location)}`;
          const isTopPriority = opt.badge.includes('1') || opt.badge.includes('首選');

          optionsHTML += `
            <div class="p-2.5 rounded-xl border transition flex items-start justify-between gap-2.5 ${
              isTopPriority 
                ? 'bg-amber-50/70 border-amber-200/90' 
                : 'bg-slate-50/80 border-slate-200/80'
            }">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-1.5 mb-1 flex-wrap">
                  <span class="text-[11px] font-bold px-2 py-0.5 rounded-md ${
                    isTopPriority 
                      ? 'bg-amber-500 text-white shadow-2xs' 
                      : 'bg-slate-200 text-slate-700'
                  }">
                    ${opt.badge}
                  </span>
                  <span class="text-xs font-bold text-slate-800 tracking-tight">
                    ${opt.name}
                  </span>
                </div>
                ${opt.detail && opt.detail !== opt.name ? `
                  <p class="text-[11px] text-slate-600 leading-relaxed pl-0.5">
                    ${opt.detail}
                  </p>
                ` : ''}
              </div>

              <!-- 專屬導航按鈕 -->
              <a href="${optMapLink}" target="_blank" rel="noopener noreferrer" title="導航至 ${opt.name}"
                 class="shrink-0 p-1.5 rounded-lg text-slate-400 hover:text-sky-600 hover:bg-white transition border border-transparent hover:border-slate-200">
                <i class="ph-bold ph-navigation-arrow text-base"></i>
              </a>
            </div>
          `;
        });

        optionsHTML += `
            </div>
          </div>
        `;
      }

      return `
        <div class="bg-white rounded-2xl p-3.5 md:p-4 shadow-sm border border-slate-100 hover:border-sky-200 transition mb-3 ${
          isChecked ? 'opacity-65 bg-slate-50/80' : ''
        }">
          <div class="flex items-start justify-between gap-3">
            <!-- 勾選框 -->
            <button onclick="toggleCheck('${item.id}')" class="mt-0.5 text-2xl transition transform active:scale-90 ${
              isChecked ? 'text-emerald-500' : 'text-slate-300 hover:text-slate-400'
            }">
              <i class="ph-fill ${isChecked ? 'ph-check-circle' : 'ph-circle'}"></i>
            </button>

            <!-- 內容本體 -->
            <div class="flex-1 min-w-0">
              <div class="flex flex-wrap items-center gap-1.5 mb-1">
                ${item.time ? `
                  <span class="text-[11px] md:text-xs font-bold text-sky-700 bg-sky-50 px-2.5 py-0.5 rounded-md flex items-center gap-1">
                    <i class="ph ph-clock"></i> ${item.time}
                  </span>
                ` : ''}
                ${item.tag ? `
                  <span class="text-[11px] md:text-xs font-medium text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md">
                    ${item.tag}
                  </span>
                ` : ''}
                ${dayDate ? `
                  <span class="text-[11px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">
                    Day ${dayNum} (${dayDate})
                  </span>
                ` : ''}
              </div>

              <h3 class="text-sm md:text-base font-bold text-slate-800 ${
                isChecked ? 'line-through text-slate-400' : ''
              }">
                ${item.title}
              </h3>

              ${item.desc ? `
                <p class="text-xs md:text-sm text-slate-600 mt-1 leading-relaxed whitespace-pre-line">
                  ${item.desc}
                </p>
              ` : ''}

              <!-- 嵌入候選方案多選項卡片 -->
              ${optionsHTML}
            </div>

            <!-- 主景點 Google Maps 導航 -->
            ${mainMapLink ? `
              <a href="${mainMapLink}" target="_blank" rel="noopener noreferrer" title="導航至 ${item.location}"
                 class="shrink-0 p-2 text-slate-400 hover:text-sky-600 hover:bg-sky-50 rounded-xl transition">
                <i class="ph-bold ph-navigation-arrow text-xl"></i>
              </a>
            ` : ''}
          </div>
        </div>
      `;
    }

    function switchTab(idx) {
      currentDayIdx = idx;
      clearSearch(false);
      buildTabs();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleCheck(id) {
      if (checkedItems[id]) {
        delete checkedItems[id];
      } else {
        checkedItems[id] = true;
      }
      localStorage.setItem('okinawa_trip_checked', JSON.stringify(checkedItems));
      render();
    }

    function updateProgress() {
      let total = 0;
      let completed = 0;
      tripData.forEach(day => {
        day.items.forEach(item => {
          total++;
          if (checkedItems[item.id]) completed++;
        });
      });

      const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
      document.getElementById('progressBar').style.width = `${percentage}%`;
      document.getElementById('progressText').innerText = `${completed} / ${total} (${percentage}%)`;
    }

    function clearSearch(shouldRender = true) {
      document.getElementById('searchInput').value = '';
      if (shouldRender) render();
    }

    function toggleMdModal() {
      const modal = document.getElementById('mdModal');
      modal.classList.toggle('hidden');
    }

    function applyManualMd() {
      const val = document.getElementById('manualMdInput').value;
      if (val.trim()) {
        applyParsedMarkdown(val);
        toggleMdModal();
      }
    }

    // 即時關鍵字搜尋監聽
    document.getElementById('searchInput').addEventListener('input', () => {
      render();
    });

    // 啟動加載
    loadItinerary();
  </script>
