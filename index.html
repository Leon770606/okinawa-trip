<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>沖繩 5D4N 親子自駕慢活之旅</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons CDN -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-16">

  <!-- 頂部導航與標題 -->
  <header class="bg-gradient-to-r from-sky-600 to-teal-500 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          <i class="ph-bold ph-sun text-amber-300 text-2xl"></i>
          <h1 id="siteTitle" class="text-xl md:text-2xl font-black tracking-wide">沖繩自駕之旅</h1>
        </div>
        <p id="siteSubtitle" class="text-xs text-sky-100 mt-1">載入行程中...</p>
      </div>

      <!-- 快速即時搜尋框 -->
      <div class="relative w-full md:w-64">
        <i class="ph ph-magnifying-glass absolute left-3 top-2.5 text-slate-400"></i>
        <input
          id="searchInput"
          type="text"
          placeholder="搜尋景點、美食、備註..."
          class="w-full pl-9 pr-3 py-1.5 text-sm text-slate-800 rounded-full bg-white/95 focus:outline-none focus:ring-2 focus:ring-amber-300 transition"
        />
      </div>
    </div>

    <!-- 天數切換頁籤（由 JS 自動產生） -->
    <div id="tabNav" class="max-w-4xl mx-auto px-4 mt-2 overflow-x-auto custom-scrollbar flex gap-2 pb-2"></div>
  </header>

  <!-- 主畫面 -->
  <main class="max-w-4xl mx-auto px-4 mt-6">

    <!-- 進度統計條 -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-6">
      <div class="flex items-center justify-between text-xs text-slate-500 font-bold mb-2">
        <span class="flex items-center gap-1.5">
          <i class="ph-bold ph-check-circle text-emerald-500 text-base"></i> 行程打卡進度
        </span>
        <span id="progressText">0 / 0 完成</span>
      </div>
      <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
        <div id="progressBar" class="bg-gradient-to-r from-teal-400 to-sky-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>

    <!-- 行程卡片容器 -->
    <div id="itineraryContainer" class="space-y-4">
      <div class="p-8 text-center text-slate-400 bg-white rounded-2xl shadow-sm border border-slate-100">
        正在解析 itinerary.md 檔案...
      </div>
    </div>

    <!-- 隨身提醒卡片 -->
    <div class="mt-8 bg-amber-50 border border-amber-200 rounded-2xl p-4 text-xs md:text-sm text-amber-900 space-y-2">
      <div class="font-bold flex items-center gap-2 text-amber-800">
        <i class="ph-fill ph-warning-circle text-lg"></i> 自駕出遊重要提醒：
      </div>
      <ul class="list-disc list-inside space-y-1 pl-1 text-slate-700">
        <li><strong>租車必帶</strong>：台灣駕照正本 ＋ 日文翻譯本 ＋ 護照。</li>
        <li><strong>兒童座椅</strong>：日本規定 6 歲以下乘車必須配置安全座椅。</li>
        <li><strong>還車加滿油</strong>：請使用「Regular（紅色油槍）」加滿，並保留加油發票供查驗。</li>
      </ul>
    </div>
  </main>

  <script>
    let tripData = [];
    let currentDayIdx = 0;
    let checkedItems = JSON.parse(localStorage.getItem('okinawa_trip_checked') || '{}');

    // 解析 itinerary.md 檔案結構
    function parseMarkdown(mdText) {
      const lines = mdText.split('\n');
      let title = "沖繩 5D4N 親子自駕慢活之旅";
      let subtitle = "2026/09/26（五）- 09/30（二）";
      const days = [];
      let currentDay = null;
      let currentItem = null;
      let itemIdCount = 1;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();

        if (line.startsWith('# ')) {
          title = line.replace('# ', '').trim();
        } else if (line.startsWith('> 日期：')) {
          subtitle = line.replace('> 日期：', '').trim();
        } else if (line.startsWith('## Day')) {
          const dayMatch = line.match(/^##\s*Day\s*(\d+)[:：]\s*(.*?)\s+(.*)$/);
          if (dayMatch) {
            currentDay = {
              day: parseInt(dayMatch[1], 10),
              date: dayMatch[2],
              title: dayMatch[3],
              badge: "住宿：未定",
              items: []
            };
          } else {
            currentDay = {
              day: days.length + 1,
              date: "",
              title: line.replace('## ', ''),
              badge: "",
              items: []
            };
          }
          days.push(currentDay);
          currentItem = null;
        } else if (line.startsWith('* 住宿：') && currentDay) {
          currentDay.badge = line.replace('* ', '');
        } else if (line.startsWith('### ') && currentDay) {
          const itemMatch = line.match(/^###\s*(.*?)【(.*?)】/);
          currentItem = {
            id: `item-${itemIdCount++}`,
            time: itemMatch ? itemMatch[1].trim() : "",
            title: itemMatch ? itemMatch[2].trim() : line.replace('### ', ''),
            tag: "行程",
            location: "",
            desc: ""
          };
          currentDay.items.push(currentItem);
        } else if (currentItem) {
          if (line.startsWith('* 分類：')) {
            currentItem.tag = line.replace('* 分類：', '').trim();
          } else if (line.startsWith('* 地點：')) {
            currentItem.location = line.replace('* 地點：', '').trim();
          } else if (line.startsWith('* 說明：')) {
            currentItem.desc = line.replace('* 說明：', '').trim();
          } else if (line.startsWith('* ')) {
            currentItem.desc += (currentItem.desc ? '\n' : '') + line.replace('* ', '').trim();
          }
        }
      }

      return { title, subtitle, days };
    }

    // 取得 itinerary.md 內容並初始化
    async function loadItinerary() {
      try {
        // 使用 timestamp 參數防止快取，確保在 GitHub Pages 上更新 md 後能即時顯示
        const res = await fetch('itinerary.md?t=' + new Date().getTime());
        if (!res.ok) throw new Error("找不到 itinerary.md 檔案");
        const mdText = await res.text();
        const parsed = parseMarkdown(mdText);

        document.getElementById('siteTitle').innerText = parsed.title;
        document.getElementById('siteSubtitle').innerText = parsed.subtitle;
        tripData = parsed.days;

        buildTabs();
        render();
      } catch (err) {
        console.error(err);
        document.getElementById('itineraryContainer').innerHTML = `
          <div class="p-6 bg-red-50 border border-red-200 rounded-2xl text-red-700 text-sm">
            <strong>讀取 itinerary.md 失敗：</strong><br>
            請確認 <code>itinerary.md</code> 與 <code>index.html</code> 位於同一個資料夾，且已推送到 GitHub 上。
          </div>
        `;
      }
    }

    // 建立天數頁籤
    function buildTabs() {
      const tabNav = document.getElementById('tabNav');
      tabNav.innerHTML = '';
      tripData.forEach((d, idx) => {
        const btn = document.createElement('button');
        btn.className = idx === 0 
          ? "tab-btn active shrink-0 px-4 py-2 rounded-xl text-xs md:text-sm font-bold bg-white text-sky-700 shadow-sm transition"
          : "tab-btn shrink-0 px-4 py-2 rounded-xl text-xs md:text-sm font-bold bg-white/20 hover:bg-white/30 text-white transition";
        btn.innerText = `Day ${d.day} (${d.date.split('（')[0]})`;
        btn.onclick = () => switchTab(idx);
        tabNav.appendChild(btn);
      });
    }

    // 渲染卡片與內容
    function render() {
      const container = document.getElementById('itineraryContainer');
      const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();

      if (!tripData || tripData.length === 0) return;

      if (searchTerm) {
        let resultsHTML = `<div class="text-xs font-bold text-slate-500 mb-3">搜尋「${searchTerm}」的結果：</div>`;
        let foundAny = false;

        tripData.forEach((dayObj) => {
          dayObj.items.forEach(item => {
            if (item.title.toLowerCase().includes(searchTerm) ||
                item.desc.toLowerCase().includes(searchTerm) ||
                item.time.toLowerCase().includes(searchTerm) ||
                item.tag.toLowerCase().includes(searchTerm)) {
              foundAny = true;
              resultsHTML += renderCard(item, dayObj.day, dayObj.date);
            }
          });
        });

        if (!foundAny) {
          resultsHTML += `<div class="p-8 text-center text-slate-400 bg-white rounded-2xl shadow-sm border border-slate-100">沒有找到符合的行程項目</div>`;
        }
        container.innerHTML = resultsHTML;
        return;
      }

      const dayData = tripData[currentDayIdx];
      let html = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-slate-100 gap-2 mb-4">
          <div>
            <div class="text-xs font-black text-sky-600 uppercase tracking-widest">Day ${dayData.day} ・ ${dayData.date}</div>
            <h2 class="text-lg md:text-xl font-black text-slate-800">${dayData.title}</h2>
          </div>
          ${dayData.badge ? `
            <span class="inline-flex items-center gap-1 text-xs bg-sky-50 text-sky-700 px-3 py-1 rounded-full font-medium self-start sm:self-auto">
              <i class="ph-bold ph-bed"></i> ${dayData.badge}
            </span>
          ` : ''}
        </div>
      `;

      dayData.items.forEach(item => {
        html += renderCard(item, dayData.day);
      });

      container.innerHTML = html;
      updateProgress();
    }

    function renderCard(item, dayNum, dayDate) {
      const isChecked = !!checkedItems[item.id];
      const mapLink = item.location
        ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.location)}`
        : null;

      return `
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 hover:border-sky-200 transition mb-3 ${isChecked ? 'opacity-60 bg-slate-50' : ''}">
          <div class="flex items-start justify-between gap-3">
            <button onclick="toggleCheck('${item.id}')" class="mt-0.5 text-xl transition transform active:scale-95 ${isChecked ? 'text-emerald-500' : 'text-slate-300 hover:text-slate-400'}">
              <i class="ph-fill ${isChecked ? 'ph-check-circle' : 'ph-circle'}"></i>
            </button>

            <div class="flex-1 min-w-0">
              <div class="flex flex-wrap items-center gap-2 mb-1">
                ${item.time ? `
                  <span class="text-xs font-bold text-sky-700 bg-sky-50 px-2.5 py-0.5 rounded-md flex items-center gap-1">
                    <i class="ph ph-clock"></i> ${item.time}
                  </span>
                ` : ''}
                ${item.tag ? `
                  <span class="text-xs font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md">
                    ${item.tag}
                  </span>
                ` : ''}
                ${dayDate ? `<span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">Day ${dayNum} (${dayDate})</span>` : ''}
              </div>

              <h3 class="text-base font-bold text-slate-800 ${isChecked ? 'line-through text-slate-400' : ''}">
                ${item.title}
              </h3>
              ${item.desc ? `
                <p class="text-xs md:text-sm text-slate-600 mt-1 leading-relaxed whitespace-pre-line">
                  ${item.desc}
                </p>
              ` : ''}
            </div>

            ${mapLink ? `
              <a href="${mapLink}" target="_blank" rel="noopener noreferrer" title="開啟 Google Maps 導航" class="shrink-0 p-2 text-slate-400 hover:text-sky-600 hover:bg-sky-50 rounded-xl transition">
                <i class="ph-bold ph-navigation-arrow text-xl"></i>
              </a>
            ` : ''}
          </div>
        </div>
      `;
    }

    function switchTab(idx) {
      currentDayIdx = idx;
      document.getElementById('searchInput').value = '';
      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach((tab, index) => {
        tab.className = index === idx
          ? "tab-btn active shrink-0 px-4 py-2 rounded-xl text-xs md:text-sm font-bold bg-white text-sky-700 shadow-sm transition"
          : "tab-btn shrink-0 px-4 py-2 rounded-xl text-xs md:text-sm font-bold bg-white/20 hover:bg-white/30 text-white transition";
      });
      render();
    }

    function toggleCheck(id) {
      if (checkedItems[id]) {
        delete checkedItems[id];
      } else {
        checkedItems[id] = true;
      }
      localStorage.setItem('okinawa_trip_checked', JSON.stringify(checkedItems));
      render();
    }

    function updateProgress() {
      let total = 0;
      let completed = 0;
      tripData.forEach(day => {
        day.items.forEach(item => {
          total++;
          if (checkedItems[item.id]) completed++;
        });
      });

      const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
      document.getElementById('progressBar').style.width = `${percentage}%`;
      document.getElementById('progressText').innerText = `${completed} / ${total} 完成 (${percentage}%)`;
    }

    document.getElementById('searchInput').addEventListener('input', () => {
      render();
    });

    // 啟動加載
    loadItinerary();
  </script>
</body>
</html>
