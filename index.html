<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>沖繩 5D4N 親子自駕遊行程表</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons CDN -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-16">

  <!-- Header Banner -->
  <header class="bg-gradient-to-r from-sky-600 via-teal-600 to-sky-700 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 md:py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          <i class="ph-fill ph-sun text-amber-300 text-2xl"></i>
          <h1 id="tripTitle" class="text-xl md:text-2xl font-black tracking-wide">沖繩親子自駕・5天4夜度假全紀錄</h1>
        </div>
        <p class="text-xs text-sky-100 mt-0.5">2026/09/26（五）- 09/30（二）｜ 與 itinerary.md 即時同步</p>
      </div>

      <!-- 快速搜尋框 -->
      <div class="relative w-full md:w-64">
        <i class="ph ph-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
        <input
          id="searchInput"
          type="text"
          placeholder="搜尋景點、餐廳、備註..."
          class="w-full pl-9 pr-3 py-1.5 text-sm text-slate-800 rounded-full bg-white/95 focus:outline-none focus:ring-2 focus:ring-amber-300 transition shadow-inner"
        />
      </div>
    </div>

    <!-- Day Navigation Bar -->
    <div id="dayTabsContainer" class="max-w-4xl mx-auto px-4 overflow-x-auto custom-scrollbar flex gap-2 pb-2.5 pt-1">
      <!-- 動態生成天數按鈕 -->
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-4xl mx-auto px-4 mt-5">

    <!-- 行程整體進度條 -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-5">
      <div class="flex items-center justify-between text-xs text-slate-500 font-bold mb-2">
        <span class="flex items-center gap-1.5">
          <i class="ph-bold ph-check-circle text-emerald-500 text-base"></i> 行程打卡進度
        </span>
        <span id="progressText">0 / 0 完成 (0%)</span>
      </div>
      <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
        <div id="progressBar" class="bg-gradient-to-r from-teal-400 to-sky-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>

    <!-- 行程卡片容器 -->
    <div id="itineraryContainer" class="space-y-4">
      <div class="p-8 text-center text-slate-400 bg-white rounded-2xl border border-slate-100">
        <i class="ph ph-spinner animate-spin text-2xl text-sky-500 mb-2"></i>
        <p class="text-sm">正在載入行程資料...</p>
      </div>
    </div>

    <!-- 備忘提示區 -->
    <div class="mt-8 bg-amber-50 border border-amber-200 rounded-2xl p-4 text-xs md:text-sm text-amber-900 space-y-2 shadow-sm">
      <div class="font-bold flex items-center gap-2 text-amber-800">
        <i class="ph-fill ph-warning-circle text-lg"></i> 自駕出遊重要備忘提醒：
      </div>
      <ul class="list-disc list-inside space-y-1 pl-1 text-slate-700 leading-relaxed">
        <li><strong>取車必備證件</strong>：台灣駕照「正本」＋ 日文譯本 ＋ 護照（缺一不可）。</li>
        <li><strong>兒童安全座椅</strong>：未滿 6 歲孩童依法必備安全座椅，取車確認安裝穩固。</li>
        <li><strong>足跡租車還車油料</strong>：Day 5 還車前需於營業所指定加油站「レギュラー（紅色 Regular 油槍）」加滿，並出示加油發票簽收。</li>
      </ul>
    </div>
  </main>

  <script>
    let tripData = [];
    let currentDayIdx = 0;
    let checkedItems = JSON.parse(localStorage.getItem('okinawa_trip_checked') || '{}');

    // 超高容錯 Markdown 解析器
    function parseMarkdown(mdText) {
      const lines = mdText.split(/\r?\n/);
      const days = [];
      let currentDay = null;
      let currentItem = null;
      let currentSubItem = null;

      for (let i = 0; i < lines.length; i++) {
        const rawLine = lines[i];
        const line = rawLine.trim();

        // 匹配 Day 標題: ## Day 1：9/26（六）初抵沖繩...
        const dayMatch = line.match(/^##\s+Day\s*(\d+)[：:\s]+(.+)/i);
        if (dayMatch) {
          currentDay = {
            day: parseInt(dayMatch[1]),
            rawTitle: dayMatch[2].trim(),
            badge: "住宿安排中",
            items: []
          };
          days.push(currentDay);
          currentItem = null;
          currentSubItem = null;
          continue;
        }

        // 高容錯匹配住宿資訊:
        // 支援 > **今日住宿**：[飯店名]、> 住宿: 飯店名、**今日住宿**： 等各種格式
        const hotelMatch = line.match(/(?:今日住宿|住宿)[：:\s]+(.+)/i);
        if (hotelMatch && currentDay) {
          let hotelName = hotelMatch[1].trim();
          // 清除 Markdown 標籤、引號、中括號與星號
          hotelName = hotelName.replace(/[\*\[\]>`"']/g, '').trim();
          // 如果後方有額外備註或括號，保留主店名
          if (hotelName) {
            currentDay.badge = hotelName;
          }
          continue;
        }

        // 匹配主行程: ### 19:30 - 21:00【晚餐：焼肉にく久（已訂位 19:30）】 或 ### 10:00【退房出發】
        const itemMatch = line.match(/^###\s+([\d:~\-–\s]+)?【(.+?)】/);
        if (itemMatch && currentDay) {
          const timeStr = itemMatch[1] ? itemMatch[1].trim() : '';
          const titleStr = itemMatch[2].trim();
          const itemId = `d${currentDay.day}-${currentDay.items.length + 1}`;

          currentItem = {
            id: itemId,
            time: timeStr,
            title: titleStr,
            tag: getTagFromTitle(titleStr),
            location: "",
            desc: "",
            subItems: []
          };
          currentDay.items.push(currentItem);
          currentSubItem = null;
          continue;
        }

        // 匹配子項目: #### [順位 1（首選推薦）] Taco Rice Cafe Kijimuna
        const subMatch = line.match(/^####\s+(.+)/);
        if (subMatch && currentItem) {
          const rawSubTitle = subMatch[1].trim();
          let tag = "";
          let name = rawSubTitle;
          const tagMatch = rawSubTitle.match(/^\[(.+?)\]\s*(.+)/);
          if (tagMatch) {
            tag = tagMatch[1].trim();
            name = tagMatch[2].trim();
          }

          currentSubItem = {
            name: name,
            tag: tag,
            location: "",
            desc: ""
          };
          currentItem.subItems.push(currentSubItem);
          continue;
        }

        // 匹配地點屬性
        const locMatch = line.match(/^[\*\-]?\s*地點[：:]\s*(.+)/);
        if (locMatch) {
          const loc = locMatch[1].replace(/[\[\]]/g, '').trim();
          if (currentSubItem) {
            currentSubItem.location = loc;
          } else if (currentItem) {
            currentItem.location = loc;
          }
          continue;
        }

        // 匹配說明或推薦屬性
        const descMatch = line.match(/^[\*\-]?\s*(?:說明|推薦)[：:]\s*(.+)/);
        if (descMatch) {
          const descText = descMatch[1].trim();
          if (currentSubItem) {
            currentSubItem.desc = (currentSubItem.desc ? currentSubItem.desc + ' ' : '') + descText;
          } else if (currentItem) {
            currentItem.desc = (currentItem.desc ? currentItem.desc + ' ' : '') + descText;
          }
          continue;
        }

        // 一般條列內文
        if (line.startsWith('* ') || line.startsWith('- ')) {
          const pureText = line.replace(/^[\*\-]\s*/, '').trim();
          if (currentSubItem) {
            currentSubItem.desc = (currentSubItem.desc ? currentSubItem.desc + '\n' : '') + pureText;
          } else if (currentItem) {
            currentItem.desc = (currentItem.desc ? currentItem.desc + '\n' : '') + pureText;
          }
          continue;
        }
      }

      return days;
    }

    function getTagFromTitle(title) {
      if (title.includes('飛行') || title.includes('接駁') || title.includes('開車') || title.includes('移動') || title.includes('還車') || title.includes('退房') || title.includes('取車')) return '交通';
      if (title.includes('餐') || title.includes('燒肉') || title.includes('拉麵') || title.includes('飯糰') || title.includes('海鮮') || title.includes('壽司') || title.includes('牛舌')) return '美食';
      if (title.includes('水族館') || title.includes('玩水') || title.includes('海灘') || title.includes('動物園') || title.includes('公園') || title.includes('探索館')) return '玩樂';
      if (title.includes('逛街') || title.includes('採買') || title.includes('血拚') || title.includes('唐吉訶德') || title.includes('玩具') || title.includes('寶可夢') || title.includes('DFS')) return '購物';
      if (title.includes('Check-in') || title.includes('整裝') || title.includes('回房')) return '住宿/休憩';
      return '行程';
    }

    function renderTabs() {
      const container = document.getElementById('dayTabsContainer');
      container.innerHTML = tripData.map((d, idx) => {
        const isActive = idx === currentDayIdx;
        const activeClass = "bg-white text-sky-700 shadow-sm";
        const inactiveClass = "bg-white/20 hover:bg-white/30 text-white";
        return `
          <button onclick="switchTab(${idx})" class="shrink-0 px-4 py-2 rounded-xl text-xs md:text-sm font-bold transition ${isActive ? activeClass : inactiveClass}">
            Day ${d.day}
          </button>
        `;
      }).join('');
    }

    function render() {
      const container = document.getElementById('itineraryContainer');
      const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();

      if (!tripData || tripData.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-400 bg-white rounded-2xl">沒有行程資料</div>`;
        return;
      }

      if (searchTerm) {
        let resultsHTML = `<div class="text-xs font-bold text-slate-500 mb-2 flex items-center gap-1.5"><i class="ph ph-magnifying-glass"></i> 搜尋「${searchTerm}」的結果：</div>`;
        let found = false;

        tripData.forEach(dayObj => {
          dayObj.items.forEach(item => {
            const matchMain = item.title.toLowerCase().includes(searchTerm) || item.desc.toLowerCase().includes(searchTerm) || item.location.toLowerCase().includes(searchTerm);
            const matchSub = item.subItems.some(s => s.name.toLowerCase().includes(searchTerm) || s.desc.toLowerCase().includes(searchTerm) || s.location.toLowerCase().includes(searchTerm));

            if (matchMain || matchSub) {
              found = true;
              resultsHTML += renderCard(item, dayObj.day);
            }
          });
        });

        if (!found) {
          resultsHTML += `<div class="p-8 text-center text-slate-400 bg-white rounded-2xl border border-slate-100">未找到相符的景點或餐廳</div>`;
        }
        container.innerHTML = resultsHTML;
        return;
      }

      const dayData = tripData[currentDayIdx];
      let html = `
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
          <div>
            <div class="text-xs font-black text-sky-600 uppercase tracking-wider">Day ${dayData.day}</div>
            <h2 class="text-base md:text-lg font-black text-slate-800">${dayData.rawTitle}</h2>
          </div>
          <span class="inline-flex items-center gap-1.5 text-xs bg-sky-50 text-sky-700 px-3 py-1.5 rounded-xl font-bold self-start sm:self-auto border border-sky-100 shrink-0 shadow-2xs">
            <i class="ph-fill ph-bed text-sky-500"></i> ${dayData.badge}
          </span>
        </div>
      `;

      dayData.items.forEach(item => {
        html += renderCard(item, dayData.day);
      });

      container.innerHTML = html;
      updateProgress();
    }

    function renderCard(item, dayNum) {
      const isChecked = !!checkedItems[item.id];
      const mainMapLink = item.location ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.location)}` : null;

      let subItemsHTML = '';
      if (item.subItems && item.subItems.length > 0) {
        subItemsHTML = `
          <div class="mt-3 space-y-2 border-t border-slate-100 pt-3">
            ${item.subItems.map(sub => {
              const subMapLink = sub.location ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(sub.location)}` : null;
              const isPrimary = sub.tag.includes('順位 1') || sub.tag.includes('首選') || sub.tag.includes('推薦 1') || sub.tag.includes('步驟 1');
              
              return `
                <div class="rounded-xl p-2.5 transition border ${isPrimary ? 'bg-amber-50/80 border-amber-200' : 'bg-slate-50 border-slate-200/80'}">
                  <div class="flex items-start justify-between gap-2">
                    <div class="flex-1 min-w-0">
                      <div class="flex items-center gap-1.5 flex-wrap mb-1">
                        ${sub.tag ? `
                          <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-md ${isPrimary ? 'bg-amber-500 text-white' : 'bg-slate-200 text-slate-700'}">
                            ${sub.tag}
                          </span>
                        ` : ''}
                        <span class="text-xs md:text-sm font-bold text-slate-800">${sub.name}</span>
                      </div>
                      ${sub.desc ? `<p class="text-xs text-slate-600 leading-relaxed whitespace-pre-line">${sub.desc}</p>` : ''}
                    </div>
                    ${subMapLink ? `
                      <a href="${subMapLink}" target="_blank" rel="noopener noreferrer" title="導航至 ${sub.location}" class="shrink-0 p-1.5 text-slate-400 hover:text-sky-600 hover:bg-white rounded-lg transition shadow-xs">
                        <i class="ph-bold ph-navigation-arrow text-base"></i>
                      </a>
                    ` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      return `
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 hover:border-sky-200 transition ${isChecked ? 'opacity-60 bg-slate-50' : ''}">
          <div class="flex items-start justify-between gap-3">
            <!-- 勾選框 -->
            <button onclick="toggleCheck('${item.id}')" class="mt-0.5 text-xl transition transform active:scale-90 shrink-0 ${isChecked ? 'text-emerald-500' : 'text-slate-300 hover:text-slate-400'}">
              <i class="ph-fill ${isChecked ? 'ph-check-circle' : 'ph-circle'}"></i>
            </button>

            <!-- 內容本體 -->
            <div class="flex-1 min-w-0">
              <div class="flex flex-wrap items-center gap-2 mb-1">
                ${item.time ? `
                  <span class="text-xs font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded-md flex items-center gap-1 border border-sky-100/50">
                    <i class="ph ph-clock"></i> ${item.time}
                  </span>
                ` : ''}
                <span class="text-xs font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md">
                  ${item.tag}
                </span>
              </div>

              <h3 class="text-sm md:text-base font-bold text-slate-800 ${isChecked ? 'line-through text-slate-400' : ''}">
                ${item.title}
              </h3>

              ${item.desc ? `
                <p class="text-xs md:text-sm text-slate-600 mt-1 leading-relaxed whitespace-pre-line">
                  ${item.desc}
                </p>
              ` : ''}

              <!-- 候選子項目卡片 -->
              ${subItemsHTML}
            </div>

            <!-- 主地標導航按鈕 -->
            ${mainMapLink ? `
              <a href="${mainMapLink}" target="_blank" rel="noopener noreferrer" title="開啟 Google 地圖" class="shrink-0 p-2 text-slate-400 hover:text-sky-600 hover:bg-sky-50 rounded-xl transition">
                <i class="ph-bold ph-navigation-arrow text-lg"></i>
              </a>
            ` : ''}
          </div>
        </div>
      `;
    }

    function switchTab(idx) {
      currentDayIdx = idx;
      document.getElementById('searchInput').value = '';
      renderTabs();
      render();
    }

    function toggleCheck(id) {
      if (checkedItems[id]) {
        delete checkedItems[id];
      } else {
        checkedItems[id] = true;
      }
      localStorage.setItem('okinawa_trip_checked', JSON.stringify(checkedItems));
      render();
    }

    function updateProgress() {
      let total = 0;
      let completed = 0;
      tripData.forEach(day => {
        day.items.forEach(item => {
          total++;
          if (checkedItems[item.id]) completed++;
        });
      });

      const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
      document.getElementById('progressBar').style.width = `${percentage}%`;
      document.getElementById('progressText').innerText = `${completed} / ${total} 完成 (${percentage}%)`;
    }

    document.getElementById('searchInput').addEventListener('input', () => {
      render();
    });

    async function init() {
      try {
        const res = await fetch('itinerary.md?v=' + Date.now());
        if (!res.ok) throw new Error('無法載入 itinerary.md');
        const md = await res.text();
        tripData = parseMarkdown(md);
        renderTabs();
        render();
      } catch (err) {
        console.warn('遠端讀取失敗：', err);
        document.getElementById('itineraryContainer').innerHTML = `
          <div class="p-6 bg-amber-50 border border-amber-200 rounded-2xl text-amber-900 text-sm leading-relaxed">
            <p class="font-bold flex items-center gap-1.5"><i class="ph-fill ph-warning-circle text-lg"></i> 讀取提醒</p>
            <p class="text-xs text-slate-600 mt-1">無法自動取得 <code>itinerary.md</code>。若是本地直接開啟，請推送到 GitHub Pages 即可正常自動讀取！</p>
          </div>
        `;
      }
    }

    init();
  </script>
</body>
</html>
